name: Deploy Resume to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install Noto fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto fonts-noto-cjk fonts-noto-core fonts-noto-mono
          fc-cache -fv
          fc-match "Noto Sans"
          fc-match "Noto Sans CJK SC"

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk \
            texlive-xetex \
            texlive-lang-chinese \
            texlive-latex-extra

      - name: Compile LaTeX resume
        run: latexmk -xelatex -file-line-error -interaction=nonstopmode resume.tex

      - name: Prepare Pages artifact
        run: |
          mkdir -p public
          cp resume.pdf public/resume.pdf
          cp site/index.html public/index.html
          cp site/styles.css public/styles.css

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
