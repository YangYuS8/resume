name: Deploy Resume

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

  sync-cnb:
    name: Sync to CNB
    runs-on: ubuntu-latest
    needs: deploy-pages
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main to CNB
        env:
          CNB_GIT_TOKEN: ${{ secrets.CNB_GIT_TOKEN }}
        run: |
          if [ -z "$CNB_GIT_TOKEN" ]; then
            echo "CNB_GIT_TOKEN is not configured" >&2
            exit 1
          fi

          git remote add cnb https://cnb.cool/Nesoriel/YangYuS8/resume
          git -c http.extraHeader="Authorization: Basic $(printf 'cnb:%s' "$CNB_GIT_TOKEN" | base64 -w0)" \
            push --force cnb HEAD:main
